    <!-- 引入 Select2 的 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            overflow-y: auto;
        }
        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            margin: 40px auto;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .header img {
            width: 90px; /* 根据需要调整logo大小 */
            height: auto;
            margin-right: 15px;
        }
        .header h2 {
            margin: 0;
            font-size: 21px;
            color: #333;
        }
        label {
            font-size: 14px;
            color: #555;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            border: 1px solid #cccccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        /* 调整 Select2 下拉菜单的最大高度 */
        .select2-container .select2-results__options {
            max-height: 200px;
            overflow-y: auto;
        }
        /* 自定义已选标签的样式 */
        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: #4CAF50;
            border: 1px solid #4CAF50;
            color: white;
            padding-right: 25px;
            position: relative;
            border-radius: 5px;
            font-size: 14px;
            margin-top: 5px;
            pointer-events: none; /* 禁止标签响应点击事件 */
            cursor: default;
        }
        /* 调整删除按钮的位置和大小 */
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: white;
            font-weight: bold;
            font-size: 16px;
            line-height: 1;
            padding: 0 2px;
            border-radius: 50%;
            pointer-events: auto; /* 允许删除按钮响应事件 */
            background: transparent;
        }
        /* 增加删除按钮的可点击区域 */
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        #customPost, #customPurchase {
            display: none;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {

    <!-- 引入 jQuery 和 Select2 的 JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
        $(document).ready(function() {
            // 初始化 Select2
            $('#customPurchaseOption').select2({
                placeholder: "请选择您公司所使用的产品",
                allowClear: false
            });

            // 处理公司选择部分（单选）
//            $('#customIdOption').on('change', function() {
//                var customId = $('#customId');
//                if ($(this).val() === '其它') {
//                    customId.show(); // 显示文本框
//                    customId.prop('required', true); // 设置为必填
//                } else {
//                    customId.hide(); // 隐藏文本框
//                    customId.prop('required', false); // 移除必填
//                    customId.val(''); // 清空文本框内容
//                }
//            });

            // 处理岗位选择部分（单选）
            $('#customPostOption').on('change', function() {
                var customPost = $('#customPost');
                if ($(this).val() === '其它') {
                    customPost.show(); // 显示文本框
                    customPost.prop('required', true); // 设置为必填
                } else {
                    customPost.hide(); // 隐藏文本框
                    customPost.prop('required', false); // 移除必填
                    customPost.val(''); // 清空文本框内容
                }
            });

            // 处理客户使用产品部分（多选）
            $('#customPurchaseOption').on('change', function() {
                var customPurchase = $('#customPurchase');
                var selectedOptions = $(this).val() || [];
                if (selectedOptions.includes('其它')) {
                    customPurchase.show(); // 显示自定义输入框
                    customPurchase.prop('required', true); // 设置为必填
                    customPurchase.focus(); // 自动聚焦输入框
                    customPurchase[0].scrollIntoView({ behavior: 'smooth' }); // 平滑滚动到输入框
                } else {
                    customPurchase.hide(); // 隐藏自定义输入框
                    customPurchase.prop('required', false); // 移除必填
                    customPurchase.val(''); // 清空输入框内容
                }
            });

            // 阻止点击标签区域触发事件
            $(document).on('click', '.select2-selection__choice', function(e) {
                e.stopPropagation(); // 阻止事件冒泡
                // 你可以在这里添加其他逻辑，例如打开下拉菜单
            });
        });
