    <script>
        // JavaScript部分
    
        /**
         * 处理单选下拉菜单的变化，显示或隐藏自定义输入框
         * @param {string} selectId - 下拉菜单的ID
         * @param {string} inputId - 自定义输入框的ID
         */
        function handleSelectChange(selectId, inputId) {
            const selectElement = document.getElementById(selectId);
            const customInput = document.getElementById(inputId);
    
            selectElement.addEventListener('change', function() {
                if (this.value === '其它') {
                    customInput.style.display = 'block'; // 显示文本框
                    customInput.required = true; // 设置为必填
                } else {
                    customInput.style.display = 'none'; // 隐藏文本框
                    customInput.required = false; // 移除必填
                    customInput.value = ''; // 清空输入框内容
                }
            });
        }
    
        /**
         * 处理多选下拉菜单的变化，特别是“其它”选项
         * @param {string} selectId - 下拉菜单的ID
         * @param {string} inputId - 自定义输入框的ID
         */
        function handleMultiSelectChange(selectId, inputId) {
            const selectElement = document.getElementById(selectId);
            const customInput = document.getElementById(inputId);
    
            selectElement.addEventListener('change', function() {
                const selectedOptions = Array.from(selectElement.options)
                    .filter(option => option.selected)
                    .map(option => option.value);
                
                if (selectedOptions.includes('其它')) {
                    customInput.style.display = 'block'; // 显示自定义输入框
                    customInput.required = true; // 设置为必填
                } else {
                    customInput.style.display = 'none'; // 隐藏自定义输入框
                    customInput.required = false; // 移除必填
                    customInput.value = ''; // 清空输入框内容
                }
            });
        }
    
        // 初始化事件监听
    
        // 处理公司选择部分（单选）
        handleSelectChange('customIdOption', 'customId');
    
        // 处理岗位选择部分（单选）
        handleSelectChange('customPostOption', 'customPost');
    
        // 处理客户使用产品部分（多选）
        handleMultiSelectChange('customPurchaseOption', 'customPurchase');
    </script>
